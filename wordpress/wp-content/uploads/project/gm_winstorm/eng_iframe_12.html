<SCRIPT language=JavaScript>


flagPos = 0;
flagCheck = 0;

function CurrentTime()
{
//alert("in CurrentTime()");
	var currentPosition = Player1.CurrentPosition;
	var totalPosition   = Player1.Duration;
	if(flagPos == 1)
	{
		setTimeout("CurrentTime()", 1000)		
		var min = currentPosition / 60;
		min = parseInt(min);
		var sec = currentPosition % 60;
		sec = parseInt(sec);
		
		if ( 10 > min) min="0" + min;  // ���� ���� �ð� : ��
		if ( 10 > sec) sec="0" + sec;  // ���� ���� �ð� : ��	
		
		var currePos = min + ":" + sec;
		
		min = totalPosition / 60;
		min = parseInt(min);
		//alert(min);
		if ( 10 > min) min="0" + min;  // ���� ���� �ð� : 
		
		sec = totalPosition % 60;
		sec = parseInt(sec);
		//alert(sec);
		if ( 10 > sec) sec="0" + sec;		

		if(sec < 0)
			document.all("oL_pos").innerHTML = currePos;
		else {
			var totalPos = min + ":" + sec;
			document.all("oL_pos").innerHTML = "<font style='font-weight:bold;' color=#fff600>" + currePos + "</font>" +" " +":"+" "+ totalPos;
		}
	}
}
