<div style="padding:10px">
	<div class="content">
		<h3>DB암호화</h3>
		<div class="txtBox">
			<div class="txtBoxFront">
				<p>DB암호화를 신청하시면, DB암호화 메니저 서버가 추가 됩니다.</p>
				<p>메너저설정은 서비스운영관리에서 가능합니다.</p>
			</div>
		</div>
		<h4>약정선택</h4>
		<!-- 리스트테이블 -->
		<div id="LblockListTable01" class="LblockPopupTable">
			<div class="Lwrapper">
				<table summary="DB암호화 리스트">
					<caption>DB암호화 리스트</caption>
					<tfoot>
					<tr>
						<td class="Lfirst" colspan="2">금액 : <span class="txtRed">130,000</span> 원</td>
					</tr>
					</tfoot>
					<tbody>
					<tr>
						<td class="Lfirst"><input type="radio" class="Ltext"> 무약정</input></td>
						<td class="Llast"><input type="radio" class="Ltext"> 1년 약정</input></td>
					</tr>
					</tbody>
					
				</table>
				<p class="txt_bul">약정선택시 10%할인율이 적용됩니다. 약정만기 후 자동연장되며,<br /> 할인율은 동일하게 적용됩니다.</p>
			</div>
		</div>
		<!-- //리스트테이블 -->
		<!-- 페이지버튼영역 -->
		<div id="LblockButton">
			<a class="Lbtn" href="#"><span onclick="doSomething();">신청</span></a>
			<a class="Lbtn" href="#"><span onclick="doSomething();">닫기</span></a>
