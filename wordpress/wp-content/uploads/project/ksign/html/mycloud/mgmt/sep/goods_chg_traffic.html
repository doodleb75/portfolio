<body>
<div style="padding:10px">
	<div class="content">
		<h3>트래픽</h3>
		<div class="txtBox">
			<div class="txtBoxFront">
				<p>현재 공용 트래픽은 <span class="txtRed">10Mbps</span>를 사용중 이며,<br />변경 하고자하는 트래픽을 선택 하세요.<br />단 100Mbps초과 신청시 별도협의 하셔야 합니다.</p>
			</div>
		</div>
		<!-- 리스트테이블 -->
		<div id="LblockListTable01" class="LblockPopupTable">
			<div class="Lwrapper">
				<table summary="트래픽 종류 선택">
					<caption>트래픽 종류 선택</caption>
					<tfoot>
						<tr>
							<td>금액 :<span class="txtRed"> 130,000</span>원</td>
						</tr>
					</tfoot>
					<tbody>
					<tr>
						<td class="Llast">트래픽선택
						<select id="sEmpLevel">
							<option value="01">10Mbps</option> 
							<option value="02">30Mbps</option>
							<option value="02">50Mbps</option>
						</select>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
		<!-- //리스트테이블 -->
		<!-- 페이지버튼영역 -->
		<div id="LblockButton">
			<a class="Lbtn" href="#"><span onclick="doSomething();">신청</span></a>
			<a class="Lbtn" href="#"><span onclick="doSomething();">닫기</span></a>
		</div>
		<!-- //페이지버튼영역 -->
	</div>
