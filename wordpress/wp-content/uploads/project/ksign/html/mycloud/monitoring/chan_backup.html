<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>eNETner Cloud</title>
	<link rel="shortcut icon" href="./favicon.ico" />
	<link rel="stylesheet" type="text/css" href="/ksign/../css/import.css" />
	<link rel="stylesheet" type="text/css" href="/ksign/../css/monitoring.css" />
</head>
<body class="LpageMonChannel">
	<div class="signin">
		<p class="lead"><img src="../../../images/monitoring/signin_lead.jpg" alt="eNETner Cloud - elimnet" /></p>
		<hr />
		<h1><img src="../../../images/monitoring/signin_h1.jpg" alt="모니터링 서비스" /></h1>
		<div class="forms">
			<h2><img src="../../../images/monitoring/signin_tit_backup.gif" alt="Backup Monitoring" /></h2>
			<fieldset>
				<legend>로그인 계정입력</legend>
				<div class="are-here">
					<p class="acc id">
						<label for="signin-id"><img src="../../../images/monitoring/signin_lab_id.gif" alt="아이디" /></label><br />
						<span class="val"><span><input type="text" name="" id="signin-id" /></span></span>
					</p>
					<p class="acc password">
						<label for="signin-password"><img src="../../../images/monitoring/signin_lab_password.gif" alt="비밀번호" /></label><br />
						<span class="val"><span><input type="password" name="" id="signin-password" /></span></span>
					</p>
					<div class="submit"><input type="image" src="../../../images/monitoring/signin_submit_btn.gif" alt="로그인" /></div>
				</div>
			</fieldset>
		</div>
	</div>
</body>
</html>
