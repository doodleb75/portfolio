<body>

<div id="popBox" style="width:500px;">
	<!-- popupBox 헤더 -->
	<div class="pop_header">
		<h1>변동금액 등록</h1>
		<span class="p_close"><a href=""><img src="../images/common/b_pop_close.png" alt="닫기버튼" title="닫기"/></a></span>
	</div>
	<!-- //popupBox 헤더 -->
	<!-- popupBox 컨텐츠 -->
	<div class="pop_body">
		<p class="dateInfo">[<img src="../images/common/calendar-medium.png" alt="" title=""/>2012년 2월]</p>
		<div class="purposeMoney_regist">
			<p class=""><label>변동금액</label><input type="text" size=13 class="strong"><span>원 (vat별도)</span></p>
			<p class="">
				   <label>변동일자</label>
					<select>
						<option>2012</option>
						<option>2011</option>
						<option>2010</option>
					</select>년
					<select>
						<option>12</option>
						<option>11</option>
						<option>11</option>
					</select>월
					<select>
						<option>12</option>
						<option>11</option>
						<option>11</option>
					</select>일 
				</span>
			</p>
			<p class=""><label>변동사유</label><input type="text" id="" name="" size=50/></p>
			<hr></hr>
			
			<p class=""><label>판매목표금액</label><input type="text" size=13 class="strong"> <span>원(VAT별도)</span></p>
			<p class=""><label>최소보장금액</label><input type="text" size=13 class="strong"> <span>원 <em>*판매목표금액 * <input type=text id="" name="" size=1 class="strong"/>%</em></span></p>
			<p class=""><label>최소보장금액</label><input type="text" size=13 class="strong"> <span>원 <em>*판매목표금액 * VAT *<input type=text id="" name="" size=1 class="strong"/>개월</em></span></p>
			<p class=""><label>최소보장금액</label><input type="text" size=13 class="strong"> <span>원 <em>*지금이행보증금 * <input type=text id="" name="" size=1 class="strong"/>%</em></span></p>
		</div>
			<div class="Block_alignC">
				<span class="button small-g strong icon"><span class="confirm"></span><a href="#" title="저장">저장</a></span>
				<span class="button small-g strong icon"><span class="cancel"></span><a href="#" title="취소">취소</a></span>
			</div>
	</div>
	<!-- //popupBox 컨텐츠 -->
</div>
