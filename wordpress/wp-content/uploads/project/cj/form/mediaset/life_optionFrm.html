<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="content-type" content="text/html; charset=utf-8" />
		<title>헬로비전</title>
		<link rel="stylesheet" type="text/css" href="/css/redmond/jquery-ui-1.8.16.custom.css" media="screen" /> 
		<link rel="stylesheet" type="text/css" href="/css/common.css" media="screen" />
		<link rel="stylesheet" type="text/css" href="/css/ui.jqgrid.css" media="screen" />
	</head>
	<body> 
		<table id="listTable"></table>s
		<div id="pagesDiv"></div>
		<script type="text/javascript" src="/lib/js/jquery-1.6.1.min.js"></script>
		<script type="text/javascript" src="/lib/js/jquery-ui-1.8.16.custom.min.js"></script>
		<script type="text/javascript" src="/lib/js/plugin/jquery.msPopup.js"></script>		 
		<script type="text/javascript" src="/lib/js/plugin/jquery.form.js"></script>
		<script type="text/javascript" src="/lib/js/plugin/i18n/grid.locale-kr.js"></script>
		<script type="text/javascript" src="/lib/js/plugin/jquery.jqGrid.4.0.min.js"></script>
		<script type="text/javascript" src="/lib/js/common.js"></script>
		<script type="text/javascript" src="/lib/js/common_ux.js"></script>
		<script>
			var oGridRows = "";   //전역변수 설정 행선택시 행에 속한데이터를 변수에담기위해
			$(function () {
				jQuery("#listTable").jqGrid({         
				          url:"./example1.json",  //데이터 요청 페이지 URL
				          datatype: 'json',  //리턴타입 ( JSON ,XML 
				          jsonReader : {root:'rows'},   //JSON 리턴값 루트
				          colNames:['셋탑코드', '셋탑명', '타입', '플렛폼', '설치위치' ,'셋탑타입 코드','플랫폼 코드','게시기 코드','STBIP','오디오볼륨'],  //상단 컬럼명
				          /**
				           * Conventions
				           * colModel :
				           * sortable : 정렬유무
				           * index : 정렬 코드
				           * name  : 행선택시 행의 Object의 고유값
				           * width : 가로크기
				           * align : 글자 정렬
				           * hidden : hidden 유무
				           */
				          colModel:[
				                             {name:'stb_code',        sortable:true,    index:'stb_code',            width:'300',        align:'left'  },
				                             {name:'stb_name',        sortable:true,    index:'stb_name',            width:'300',        align:'left'  },
				                             {name:'pos_desc',        sortable:true,    index:'pos_desc',            width:'100',        align:'center'  },
				                             {name:'platform_desc',   sortable:true,    index:'platform_desc',       width:'100',        align:'center'  }, 
				                             {name:'stb_type_desc',   sortable:true,    index:'stb_type_desc',       width:'100',        align:'center'},  
				                             {name:'platform',        sortable:false,   width:'20', hidden: true  },
				                             {name:'stb_type',        sortable:false,   width:'20', hidden: true },
				                             {name:'pos_code',        sortable:false,   width:'20', hidden: true },
				                             {name:'ipaddr',          sortable:false,   width:'20', hidden: true },
				                             {name:'audio_volume',    sortable:false,   width:'20', width:'100',               align:'center' }                                             
				          ], 
				          emptyrecords:'등록된 생활정보 옵션 정보가 없습니다.',     //데이터가 없을시  널메시지
				          loadtext:'생활정보옵션 로딩 중 입니다. 잠시만 기다려 주십시오',   //데이터로드시 로딩메시지
				          mtype:'POST',   //데이터 요청페이지에 요청한 파라메터 타입
				          rowNum:20,     //기본 출력 선택
				          rowList:[20,40,60],  //출력행 선택
				          pager: '#pagesDiv',    //하단 페이징처리 레이어
				          viewrecords: true,      //하단 페이징 출력유무
				          width: 'auto',          //가로크기
				          height: '100%',         //세로크기
				          /* multiselect:true,    //체크박스 출력유무
				          multiselectWidth:50, */  //체크박스 가로사이즈
				          gridview:false,          // true 일경우 afterInsertRow 이벤트는 실행되지않습니다.
				          /**
				           * 행선택시 발생하는 이벤트  
				           * multiselect:false 일경우 이벤트가 실행되지않습니다.
				           * @param {String} id  ( 선택된 행 ID )
				           */
				          onSelectRow: function(id)
				          { 
				                   $(".ui-state-highlight",this).removeClass('ui-state-highlight');  //jquery ui css remove
				                   oGridRows = $("#listTable").getRowData(id);  //선택된 행 ID로 해당 행의 Object를 찾아 반환한다.                         
				                   //행선택시 발생할 액션 처리
				          },
				          /**
				           * 행의 데이터가 삽입후 이벤트 발생 ( rowid , rowdata, rowelem )
				           * option 이 gridview : true 일경우 이벤트를 실행하지 않습니다.
				           * 행을 변경시 사용한다.
				           * @param {String} rid
				           * @param {Object} aData
				           */
				          afterInsertRow:function(rid,aData)  {
							var  ymdhms = "";
							try{     rowdata.ymdhms = rowdata.ymdhms.substring(0,4)+"/"+rowdata.ymdhms.substring(4,6)+"/"+rowdata.ymdhms.substring(6,8)+"<br>"+rowdata.ymdhms.substring(8,10)+":"+rowdata.ymdhms.substring(10,12)+":"+rowdata.ymdhms.substring(12,14);    }catch(e){     debug("일시 변환중 에러 !! ["+e+"]");}if(rowdata.confirm_date != null){     try{          rowdata.confirm_date = rowdata.confirm_date.substring(0,4)+"/"+rowdata.confirm_date.substring(4,6)+"/"+rowdata.confirm_date.substring(6,8)+"<br>"+rowdata.confirm_date.substring(8,10)+":"+rowdata.confirm_date.substring(10,12)+":"+rowdata.confirm_date.substring(12,14);         }     catch(e)     {          debug("확인시간 변환중 에러 !! ["+e+"]");     }}$(this).setRowData(rowid, rowdata);
						  },
				          /**
				           * 모든행이 처리후 발생 출력된 데이터 반환
				           * @param {Object} aData
				           */
				          loadComplete:function(aData){},
				          /**
				           * 행 더블 클릭시 이벤트 발생
				           * @param {String} rowid  행 ID
				           * @param {Number} iRow   행 순번
				           * @param {Number} iCol   행의 몇번째
				           * @param {Object} e      이벤트 핸들러
				           */
				          ondblClickRow:function(rowid,iRow,iCol,e){},
				          /**
				           * 행 오른쪽 마우스 클릭시 발생 하는 이벤트
				           * @param {Object} rowid
				           * @param {Object} iRow
				           * @param {Object} iCol
				           * @param {Object} e   
				           */
				          onRightClickRow:function(rowid,iRow,iCol,e){},
				          /**
				           * colModel 사이즈 변경시 발생이벤트
				           * @param {Object} evt    이벤트 핸들러
				           * @param {Number} index  컬럼 순서
				           */
				          resizeStart:function(evt,index){},
				          /**
				           * colModel 사이즈 변경완료시 발생이벤트
				           * @param {Number} newWd    변경된 사이즈
				           * @param {Number} index    변경한 컬럼순서
				           */
				          resizeStop:function(newWd,index){}
				});
				jQuery("#listTable").jqGrid('navGrid','#pagesDiv',{edit:false,add:false,del:false, search:false});
			});

		</script>
	</body> 
</html>
