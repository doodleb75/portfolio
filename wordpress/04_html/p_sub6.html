<html lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Script-Type" content="text/javascript">
    <meta http-equiv="Content-Style-Type" content="text/css">

        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.6/js/materialize.min.js"></script>

    <script src="js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script>
    </script>

<body>

    <!-- Sub Contents Start // -->

    <div id="wrap" data-title="none">
        <div class="sub-header">
            <h2 class="sub-title"><button></button>미리결제</h2>

            <p>
                골프장 내장 전에 미리결제하면 경기일에 정산과 체크아웃이 보다 빠르고 간편해집니다.
            </p>
        </div>

        <div id="test1" class="sub-content-box">

            <div class="ph-number">
                <h3>정산방식</h3>
                <div class="calculate-method">
                    <div class="pre-pay-box">
                        <ul class="calc-group in-modal">
                            <li>
                                <input type="radio" id="calc03" name="calculate">
                                <label class="chk-price-sel" for="calc03">
                                    본인 입장료
                                    <p class="pee-category">그린피+카트피</p>
                                </label>
                            </li>
                            <li>
                                <input type="radio" id="calc04" name="calculate">
                                <label class="chk-price-sel" for="calc04">
                                    본인 입장료 + 디파짓
                                    <p class="pee-category">그린피+카트피+디파짓</p>
                                </label>
                            </li>
                            <li>
                                <!-- no-deposit class추가시 블라인드 -->
                                <div class="cost-deposit-option ">
                                    <div>
                                        <span>디파짓 <p>최소50,000원</p></span>
                                        <input type="text" class="input-deposit">원
                                    </div>
                                    <div class="deposit-btn-group">
                                        <button type="button">+10만원</button>
                                        <button type="button">+5만원</button>
                                        <button type="button">+1만원</button>
                                    </div>
                                </div>

                                <p>
                                    경기일 이용금액을 제외한 디파짓 잔액은 자동으로 결제취소됩니다.
                                </p>
                            </li>
                        </ul>
                        <div class="price-summary">
                            <div>
                                <span>결제예정금액</span>
                                <span class="total">267,500<i>원</i></span>
                            </div>
                            <ul class="collapsible expandable ex-box">
                                <li class="">

                                    <div class="collapsible-body etc-pay" style="display: block;">
                                        <div class="info">
                                            <span>식사[레스토랑]</i></span>
                                            <span class="line"></span>
                                            <span>62,000 원</span>
                                        </div>
                                        <div class="info">
                                            <span>음료[그늘집]</i></span>
                                            <span class="line"></span>
                                            <span>2,000 원</span>
                                        </div>
                                        <div class="info">
                                            <span>디저트[레스토랑]</i></span>
                                            <span class="line"></span>
                                            <span>12,000 원</span>
                                        </div>
                                    </div>
                                    <div class="collapsible-header detail-folding" tabindex="0">
                                        상세내역
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div class="bot-btn-group b-width-100">
                            <button type="button" class="btn-regist modal-close pop-close"
                                href="#checkout-calculate">미리결제</button>
                        </div>
                    </div>
                </div>
            </div>



        </div>
        <!--/// 팀 이용내역 contents -->

    </div>
    <script>
        $(".button-collapse").sideNav();
        $(document).ready(function () {
            /* Modal Initialized */
            $('.modal-trigger').leanModal();
            // Materialize.toast('Ready', 4000);
        });

        var elem = document.querySelector('.collapsible.expandable');
        var instance = M.Collapsible.init(elem, {
            accordion: false
        });

        /* A */
        btn1Trigger1.onclick = () => {
            Swal.fire({
                customClass: {
                    popup: 'custom-popup'
                },
                html: "<h3 class='cs-pop-text'>이용내역은 체크인 후에 확인할 수 있습니다.</h3>"
            })
        };

        /* B */
        btn1Trigger2.onclick = () => {
            Swal.fire({
                confirmButtonText: '닫기',
                customClass: {
                    popup: 'custom-popup'
                },
                html: "<h3 class='cs-pop-text'>유효하지 않은 경기입니다.</h3>"
            })
        };
    </script>
</body>

</html>
