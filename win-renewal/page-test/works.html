<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../">
    <title>WINHUB - WORKS</title>
    <link rel="stylesheet" href="assets/css/style-test.css" />
    <link rel="stylesheet" href="assets/css/works-specific.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
    </head>
<body class="subpage-body">
    
    <div id="loader-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="menu-overlay-placeholder"></div>

    <div class="canvas-cont">
      <canvas id="canvas3d"></canvas>
    </div>
    <!-- Custom Cyber Pointer Cursor -->
    <div id="custom-cursor">
      <div class="cursor-dot"></div>
      <div class="cursor-ring"></div>
    </div>

    <div class="subpage-container">
        <section id="sub-hero" class="subpage-section sub-hero-section">
            <div class="sub-hero-content">
                <h1 class="page-title title-class">WORKS</h1>
                <p class="page-description content-class">NEW USER EXPERIENCE</p>
            </div>
            <div id="threejs-object-container" class="sub-spline-container"></div>
            <p class="scroll-icon"><span class="scroll"></span></p>
        </section>

        <!-- [추가] 에스컬레이터 사각형 컨테이너 -->
        <div id="escalator-rects-container"></div>
        <section id="portfolio-area" class="subpage-section content-section unified-portfolio-filter-section">
            <div class="filter-title-controls-container">
                <!-- <h2 class="content-class section-title filter-section-title">Filter Projects</h2> -->
                <div class="filter-controls">
                    <button class="filter-button active" data-filter="all">ALL</button>
                    <button class="filter-button" data-filter="web">WEB</button>
                    <button class="filter-button" data-filter="mobile">MOBILE</button>
                    <button class="filter-button" data-filter="promotion">PROMOTION</button>
                </div>
            </div>
            <div id="portfolio-grid">
                </div>
        </section>

        <button id="scrollToTopBtn" title="위로 가기"><i class="fas fa-arrow-up"></i></button>
        
        </div>
    <div id="footer-placeholder"></div>

    <script type="module" src="assets/js/sub-test-app.js"></script>
    <script type="module" src="assets/js/works-specific.js"></script>
</body>
</html>
